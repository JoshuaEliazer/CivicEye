name: CivicEye CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------
  # 1. Backend Integration & Automated Test Suites
  # --------------------------------------------------------------
  backend-test:
    name: Backend Tests & Database Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Phase 2 DB & Model Verification
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/civiceye_test
        run: node test/dbVerification.js

      - name: Run Phase 14 Production Deployment Configuration Test
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/civiceye_test
        run: node test/deploymentTest.js

      - name: Run Phase 15 Security Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/civiceye_test
        run: node test/securityTest.js

      - name: Run Phase 15 Performance Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/civiceye_test
        run: node test/performanceTest.js

  # --------------------------------------------------------------
  # 2. Frontend Production Build & Bundle Verification
  # --------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Verify Dist Artifact
        run: |
          test -f frontend/dist/index.html
          echo "Frontend production artifact built successfully."

  # --------------------------------------------------------------
  # 3. ML Service API & Inference Validation (CPU)
  # --------------------------------------------------------------
  ml-service-test:
    name: ML Service & Model Validation (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install OS Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies (PyTorch CPU)
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Verify Baseline YOLO26 Model Weights Exist
        working-directory: ./ml-service
        run: |
          test -f model/yolo26n.pt
          echo "YOLO26 baseline weights verified."

      - name: Run Phase 4 FastAPI Automated Test Suite
        working-directory: ./ml-service
        run: python test_api.py

  # --------------------------------------------------------------
  # 4. Docker Compose & Container Configuration Validation
  # --------------------------------------------------------------
  docker-validation:
    name: Docker Configuration & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."

      - name: Verify Dockerfiles Exist
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f ml-service/Dockerfile
          test -f frontend/nginx.conf
          echo "All service Dockerfiles verified."
